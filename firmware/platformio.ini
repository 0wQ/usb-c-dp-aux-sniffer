[env]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
framework = noneos-sdk
board = genericCH32L103K8U6

build_unflags =
    -Os
    -g

build_flags =
    -include include/sdk_extern.h
    -O2
    -Wall
    -Wextra
    -Wimplicit-function-declaration
    -Wno-unused-variable
    -Wno-unused-parameter
    -Wno-format
    -Wl,--print-memory-usage
    -DDEBUG=-1 ; 取值：DISABLE 为 -1，SDI 为 0

board_build.use_lto = yes
board_build.use_builtin_startup_file = yes
board_build.use_builtin_system_code = yes
board_build.use_builtin_debug_code = no
board_build.cpp_support = no

[env:CH32L103_USBISP]
; 上传方式可选 isp、minichlink、wch-link、wlink
upload_protocol = isp

[env:CH32L103_LINKE]
upload_protocol = wlink

[env:CH32L103_LINKE_SDI_PRINT]
build_unflags =
    ${env.build_unflags}
    -DDEBUG=-1
build_flags = ${env.build_flags} -DDEBUG=0
upload_protocol = wlink
upload_command = wlink flash --enable-sdi-print $SOURCE
